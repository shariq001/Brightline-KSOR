# Simulated ingestion provenance: where each doc "lives" upstream and how it
# gets into the KSoR. In a real deployment these would be actual connector
# configs (Confluence API, Notion API, Zendesk Guide API, Google Drive API,
# Slack Events API); here they're illustrative so a portfolio project has
# something to point a real connector implementation at.

sources:
  - source_id: confluence-marketing
    system: confluence
    space: MKT
    sync_frequency: hourly
    docs:
      - {doc_id: BL-PUB-001, upstream_page_id: "MKT-2201", last_synced_at: "2026-09-14T06:00:00Z"}
      - {doc_id: BL-PUB-002, upstream_page_id: "MKT-2205", last_synced_at: "2026-09-14T06:00:00Z"}

  - source_id: zendesk-guide
    system: zendesk_guide
    brand: brightline-support
    sync_frequency: hourly
    docs:
      - {doc_id: BL-PUB-003, upstream_article_id: "9001234", last_synced_at: "2026-09-14T06:00:00Z"}
      - {doc_id: BL-PUB-005, upstream_article_id: "9001240", last_synced_at: "2026-09-14T06:00:00Z"}

